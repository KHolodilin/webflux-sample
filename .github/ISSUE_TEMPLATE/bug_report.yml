name: Bug report
description: Report a defect in this sample
labels: [ "bug" ]
body:
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "11"
    validations:
      required: true

  - type: input
    id: spring-boot-version
    attributes:
      label: Spring Boot version
      placeholder: "2.7.18"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - webflux-sample-producer
        - webflux-sample-consumer
        - both / integration
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction steps or a link to a sample project.
      placeholder: |
        1. Start consumer / producer ...
        2. Call POST /generate ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      render: text
